name: deploy-gate

# deploy-gate — the fleet pre-publish gate (original SAOS engineering).
# Lineage: STUDY-001 tier-grammar proposal; owner-approved 2026-10-18 («מאשר תמשיך ודחוף»).
# Order matters: scan -> publish receipt -> EVAL. A red gate shows on the redboard
# AND its evidence lands in git first (fail-closed, never silent).
# Laws: docs/SCOUT-PROTOCOL.md — Lanes.

on:
  schedule:
    - cron: '11 6 * * *'   # daily, off-peak (scout at 05:41, shield at 06:26)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate scan (stdlib only — never executes what it inspects)
        env:
          FLEET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy-gate.py

      - name: Publish receipt only if changed (commit + rebase-retry push)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add state/deploy-gate-last-run.json
          if git diff --cached --quiet; then
            echo "deploy-gate receipt unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "deploy-gate: receipt $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main; then exit 0; fi
            echo "push race, retry ${i}"; sleep 8
          done
          echo "could not publish the deploy-gate receipt after 3 attempts"
          exit 1

      - name: Evaluate gate (red = BLOCKER present — fail-closed)
        run: python3 scripts/deploy-gate.py --eval

      - name: Digest to step summary
        if: always()
        run: python3 scripts/deploy-gate.py --digest >> "$GITHUB_STEP_SUMMARY" || true
