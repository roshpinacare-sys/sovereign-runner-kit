#
# fleet-keeper — הצי מודד את עצמו. מפקד דינמי (אפס רשימות מקודדות — /users/ ראשי)
# של כל וורקפלו ברשת: state (active/disabled), ריצה אחרונה, רצף-אדום, סיווג מסילות-כסף.
# מפרסם state/fleet-census.json רק-אם-השתנה (אותו זוג-רשת כמו netrun-loop).
# כנות: הסריקה אינה מתקנת ואינה מפעילה דבר — היא מפרסמת אמת. התיקון = netrun claim.
#
name: fleet-keeper

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-keeper
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python (stdlib only — no deps to trust)
        run: python3 --version

      - name: Measure the fleet (dynamic enumeration, honest errors per repo)
        env:
          FLEET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fleet-census.py

      - name: Publish state/ only if changed (commit + rebase-retry push)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add state/fleet-census.json
          if git diff --cached --quiet; then
            echo "census unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "fleet-keeper: census refresh $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            echo "push race, retry ${i}"; sleep 8
          done
          echo "could not publish the census after 3 attempts"
          exit 1
